# ==============================================================================
# Grafana Dashboard Provider Configuration
# Auto-loads dashboards from /var/lib/grafana/dashboards
# ==============================================================================

apiVersion: 1

providers:
  - name: "CloudNotes Observability"
    orgId: 1
    folder: "CloudNotes SRE"
    folderUid: "cloudnotes-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
